[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "r2flow"
version = "1.0.0"
description = "R2 Flow: reward-proportional training of a skill-using agent with validated skill evolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.14.3",
    "numpy==2.3.5",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
]

[project.optional-dependencies]
policy = [
    "openai==2.6.1",
    "peft==0.19.1",
    "safetensors==0.8.0",
    "tokenizers==0.22.2",
    "torch==2.13.0",
    "transformers==5.14.1",
]
gpu = [
    "causal-conv1d==1.6.2.post1",
    "flash-linear-attention==0.5.2",
    "xgrammar",
]
alfworld = [
    "alfworld==0.5.0",
    "textworld==1.7.0",
]
[project.scripts]
r2flow-train = "r2flow.experiments.bayesian_training_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillev", "src/r2flow"]

[tool.ruff]
line-length = 100
target-version = "py311"
